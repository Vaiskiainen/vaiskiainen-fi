<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vaiskiainen</title>
    <meta name="description" content="Portfolio and projects of vaiskiainen." />
    <script>
      if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Open Graph / Discord Embed -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vaiskiainen.fi/" />
    <meta property="og:title" content="vaiskiainen" />
    <meta property="og:description" content="Portfolio and projects of vaiskiainen." />
    <meta property="og:image" content="https://vaiskiainen.fi/logo.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vaiskiainen.fi/" />
    <meta property="twitter:title" content="vaiskiainen" />
    <meta property="twitter:description" content="Portfolio and projects of vaiskiainen." />
    <meta property="twitter:image" content="https://vaiskiainen.fi/logo.png" />
    
    <meta name="theme-color" content="#18181b" />
  </head>
